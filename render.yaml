# Render Blueprint: one web service + one Postgres database.
services:
  - type: web
    name: recovery-desk
    runtime: python
    plan: free          # demo; use 0.5c-512mb or larger to avoid cold starts
    buildCommand: pip install -r requirements.txt && python samples/make_samples.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9    # Render reads this env var to pick the Python version
      - key: DATABASE_URL
        fromDatabase:
          name: recovery-desk-db
          property: connectionString
      - key: LLM_PROVIDER
        value: openai_compat
      - key: LLM_MODEL
        value: qwen/qwen3.8-27b
      - key: LLM_TOOL_MODE
        value: native
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      # Sign-in is OFF by default (public demo). To protect it, add an APP_PASSWORD
      # env var in the Render dashboard (username "desk").
      - key: DESK_DATE
        value: "2026-09-30"
databases:
  - name: recovery-desk-db
    plan: free          # demo; pick a paid plan (e.g. 0.5c-1g) for anything you keep
